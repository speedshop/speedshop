[daemons.jekyll]
run = "GENERATED_DATA_FIXTURES_PATH=test/fixtures/generated_data bundle exec jekyll build -w --future --unpublished --drafts --trace --config _config.yml,_config_dev.yml"
mise = true
retry = 0
ready_delay = 3

[daemons.static]
run = "caddy run --config Caddyfile"
mise = true
retry = 0
ready_http = "https://localhost:4000/"
port = 4000
depends = ["jekyll"]
