[env._]
file = ".env"

[settings.ruby]
compile = false

[tools]
ruby = "4.0.3"
node = "22.22.3"
pandoc = "3.9.0.2"
terraform = "1.14.6"
awscli = "2.34.1"
hk = "1.42.0"
pitchfork = "2.6.0"
caddy = "2.11.2"

[tasks.setup]
description = "Install declared mise tools, dependencies, and git hooks"
run = '''
mise install
bundle install
npm install --ignore-scripts
hk install
mise_path="$(command -v mise)"
cat > .git/hooks/pre-commit <<'EOF'
#!/bin/sh
test "${HK:-1}" = "0" || exec "__MISE_PATH__" exec -- hk run pre-commit "$@"
EOF
MISE_PATH="$mise_path" ruby -e 'path = ".git/hooks/pre-commit"; File.write(path, File.read(path).sub("__MISE_PATH__", ENV.fetch("MISE_PATH")))'
chmod +x .git/hooks/pre-commit
'''

[tasks.build]
description = "Build the site"
run = "GENERATED_DATA_FIXTURES_PATH=test/fixtures/generated_data bundle exec jekyll build"

[tasks.dev]
description = "Start the local development stack and follow logs"
run = "pitchfork start -l --force && pitchfork logs jekyll static --tail"

[tasks."dev:bg"]
description = "Start the local development stack in the background"
run = "pitchfork start -l --force"

[tasks."dev:stop"]
description = "Stop the local development stack"
run = "pitchfork stop jekyll static"

[tasks.serve]
description = "Serve the local development stack with HTTPS"
run = "pitchfork start -l --force && pitchfork logs jekyll static --tail"

[tasks.lint]
description = "Run all linters"
run = "bundle exec standardrb"

[tasks."test:quick"]
description = "Run the fast local test suite"
run = "bundle exec rake test"

[tasks."test:ruby"]
description = "Run Ruby unit tests"
run = "bundle exec rake test"

[tasks."test:browser"]
description = "Run Playwright browser tests"
depends = ["test:ruby"]
run = "npm test"

[tasks."test:integration"]
description = "Run integration tests against an isolated static site"
depends = ["test:links"]
run = "bundle exec ruby test/integration/site_test.rb"

[tasks."test:integration:prod"]
description = "Run integration tests against production"
run = "BASE_URL=https://www.speedshop.co bundle exec ruby test/integration/site_test.rb && BASE_URL=https://www.speedshop.co bundle exec ruby test/system/markdown_test.rb"

[tasks."test:links"]
description = "Run built-site link integrity checks"
depends = ["test:browser"]
run = "bundle exec rake test:links"

[tasks.test]
description = "Run all tests and linters"
depends = ["test:integration"]
run = "mise run test:website-snapshot"

[tasks."test:website-snapshot"]
description = "Exercise snapshot security and freshness through production builds"
run = "bundle exec ruby test/system/website_snapshot_test.rb"

[tasks."test:ci"]
description = "Run tests for CI"
depends = ["test:links"]
run = "mise run test:website-snapshot"
